name: CodeQL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: github/codeql-action/init@c20e34f438d671fc35777cc9820dd7adf8252874
        with:
          languages: python
      - uses: github/codeql-action/analyze@c20e34f438d671fc35777cc9820dd7adf8252874
