name: CodeQL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@c20e34f438d671fc35777cc9820dd7adf8252874
        with:
          languages: python
      - uses: github/codeql-action/analyze@c20e34f438d671fc35777cc9820dd7adf8252874
