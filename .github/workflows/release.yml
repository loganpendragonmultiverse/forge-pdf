name: Release build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: Expand-Archive -LiteralPath vendor/ocr-bundle.zip -DestinationPath ocr-bundle
      - run: python tools/build_windows.py --ocr-bundle ocr-bundle
      - run: python tools/verify_windows_portable.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-pdf-portable-acceptance
          path: portable-acceptance/
          if-no-files-found: error
      - run: python tools/checksums.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-pdf-release
          if-no-files-found: error
          path: |
            dist/Forge-PDF-*-Windows.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
