name: Release build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python tools/build_windows.py
      - run: python tools/checksums.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-pdf-release
          if-no-files-found: error
          path: |
            dist/Forge-PDF-*-Windows.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
