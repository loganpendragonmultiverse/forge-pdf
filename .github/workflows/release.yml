name: Release build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: Expand-Archive -LiteralPath vendor/ocr-bundle.zip -DestinationPath ocr-bundle
      - run: python tools/build_windows.py --ocr-bundle ocr-bundle
      - run: python tools/verify_windows_portable.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: forge-pdf-portable-acceptance
          path: portable-acceptance/
          if-no-files-found: error
      - run: python tools/checksums.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: forge-pdf-release
          if-no-files-found: error
          path: |
            dist/Forge-PDF-*-Windows.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
