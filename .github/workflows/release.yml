name: Release build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python tools/build_windows.py
      - run: python tools/checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forge-pdf-release
          if-no-files-found: error
          path: |
            dist/Forge-PDF-*-Windows.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
